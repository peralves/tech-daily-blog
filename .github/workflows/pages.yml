name: Deploy site

on:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Valider les éditions et reconstruire l'index
        run: node scripts/build-index.mjs
      - uses: actions/configure-pages@v5
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html assets data _site/
          touch _site/.nojekyll
          # anti-cache : version les fichiers statiques avec le SHA du commit
          sed -i "s/__V__/${GITHUB_SHA::8}/g" _site/index.html _site/assets/app.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
