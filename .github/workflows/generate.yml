name: Generate daily edition

on:
  schedule:
    # 6h à Paris : 4h UTC (été) et 5h UTC (hiver). Le garde-fou ci-dessous ne laisse passer que 6h locale.
    - cron: "0 4 * * *"
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Date AAAA-MM-JJ (défaut : aujourd'hui, Paris)"
        required: false
      force:
        description: "Écraser l'édition existante"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Garde-fou horaire (6h Paris)
        id: guard
        run: |
          H=$(TZ=Europe/Paris date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$H" != "06" ]; then
            echo "Il est ${H}h à Paris, on attend le bon créneau."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.run == 'true'
        with:
          node-version: 22
      - name: Générer l'édition
        if: steps.guard.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          EDITION_DATE: ${{ inputs.date }}
          FORCE: ${{ inputs.force && '1' || '' }}
        run: node scripts/generate.mjs
      - name: Commit
        id: commit
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: édition du $(TZ=Europe/Paris date +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
